name: LocalPulse CI
on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]
concurrency:
  group: localpulse-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Google OAuth Edge Function
        run: deno check supabase/functions/google-oauth/index.ts
      - name: Type-check website audit Edge Function
        run: deno check supabase/functions/website-audit/index.ts
