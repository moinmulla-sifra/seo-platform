name: LocalPulse CI
on:
  push:
    branches: [main, "implementation/**"]
  pull_request:
    branches: [main]
concurrency:
  group: localpulse-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Production build
        run: npm run build
